<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>我们的约定清单</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
  background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 30%, #f48fb1 60%, #fce4ec 100%);
  min-height: 100vh;
  padding: 16px;
}

.container { max-width: 500px; margin: 0 auto; }

h1 {
  text-align: center;
  font-size: 1.6rem;
  color: #ad1457;
  margin: 12px 0 8px;
  letter-spacing: 2px;
}

.subtitle {
  text-align: center;
  font-size: 0.85rem;
  color: #d81b60;
  margin-bottom: 16px;
}

.stats {
  display: flex;
  justify-content: center;
  gap: 24px;
  margin-bottom: 16px;
  font-size: 0.82rem;
  color: #880e4f;
}
.stats span { font-weight: bold; font-size: 1.1rem; color: #c62828; }

.emoji-bar {
  display: flex;
  justify-content: center;
  gap: 10px;
  margin-bottom: 16px;
  font-size: 1.6rem;
  animation: float 3s ease-in-out infinite;
}
@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-6px); }
}

.add-form {
  background: rgba(255,255,255,0.85);
  border-radius: 16px;
  padding: 14px;
  margin-bottom: 16px;
  box-shadow: 0 2px 12px rgba(233,30,99,0.12);
  backdrop-filter: blur(10px);
}

.add-form input {
  width: 100%;
  padding: 10px 12px;
  border: 1.5px solid #f8bbd0;
  border-radius: 12px;
  font-size: 0.95rem;
  margin-bottom: 8px;
  background: #fff;
  outline: none;
  transition: border-color 0.2s;
}
.add-form input:focus { border-color: #e91e63; }

.add-form .row {
  display: flex;
  gap: 8px;
}

.add-form .row input { flex: 1; }

.add-form button {
  width: 100%;
  padding: 11px;
  background: linear-gradient(135deg, #e91e63, #c62828);
  color: #fff;
  border: none;
  border-radius: 12px;
  font-size: 0.95rem;
  cursor: pointer;
  letter-spacing: 1px;
  margin-top: 8px;
  transition: transform 0.15s, box-shadow 0.15s;
}
.add-form button:active { transform: scale(0.97); }

.card {
  background: rgba(255,255,255,0.9);
  border-radius: 16px;
  padding: 14px 16px;
  margin-bottom: 12px;
  box-shadow: 0 2px 10px rgba(233,30,99,0.1);
  border-left: 4px solid #f48fb1;
  transition: transform 0.2s, box-shadow 0.2s;
  backdrop-filter: blur(10px);
  position: relative;
}
.card.done { border-left-color: #66bb6a; opacity: 0.85; }
.card:active { transform: scale(0.99); }

.card .card-title {
  font-size: 1rem;
  font-weight: 600;
  color: #4a148c;
  margin-bottom: 4px;
  padding-right: 24px;
}

.card .card-time {
  font-size: 0.78rem;
  color: #999;
  margin-bottom: 6px;
}

.card .card-mood {
  font-size: 1.5rem;
  margin: 4px 0;
}

.card .card-actions {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin-top: 8px;
}

.card .card-actions button {
  padding: 6px 13px;
  border-radius: 20px;
  border: 1px solid #f8bbd0;
  background: #fff;
  font-size: 0.78rem;
  cursor: pointer;
  color: #ad1457;
  transition: background 0.2s;
}
.card .card-actions button:active { background: #fce4ec; }

.card .card-actions .del-btn {
  border-color: #ef9a9a;
  color: #c62828;
}

.card .del {
  position: absolute;
  top: 10px;
  right: 12px;
  font-size: 1.1rem;
  cursor: pointer;
  opacity: 0.5;
  transition: opacity 0.2s;
}
.card .del:hover { opacity: 1; }

.mood-picker {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
  margin: 6px 0;
  padding: 8px;
  background: #fff3e0;
  border-radius: 12px;
}
.mood-picker span {
  font-size: 1.5rem;
  cursor: pointer;
  padding: 4px 8px;
  border-radius: 12px;
  transition: transform 0.15s, background 0.15s;
}
.mood-picker span:hover { transform: scale(1.3); background: #ffe0b2; }

.time-input-row {
  display: flex;
  gap: 6px;
  align-items: center;
  margin: 6px 0;
  font-size: 0.82rem;
  color: #666;
}
.time-input-row input {
  padding: 6px 10px;
  border: 1px solid #f8bbd0;
  border-radius: 10px;
  font-size: 0.82rem;
  outline: none;
}

.badge {
  display: inline-block;
  background: #e91e63;
  color: #fff;
  font-size: 0.7rem;
  padding: 2px 10px;
  border-radius: 12px;
  margin-left: 6px;
}
.badge.done-badge { background: #66bb6a; }

.empty {
  text-align: center;
  color: #ad1457;
  padding: 40px 0;
  font-size: 0.9rem;
  opacity: 0.7;
}
.empty .big { font-size: 3rem; display: block; margin-bottom: 10px; }
</style>
</head>
<body>

<div class="container">
  <div class="emoji-bar">🐻  💕  🐰</div>
  <h1>我们的约定清单</h1>
  <p class="subtitle">把想一起做的事写下来，一件一件完成 ✨</p>

  <div class="stats">
    <div>已完成<br><span id="doneCount">0</span></div>
    <div>待完成<br><span id="todoCount">0</span></div>
  </div>

  <div class="add-form">
    <input id="titleInput" placeholder="想一起做什么？" maxlength="50">
    <input id="descInput" placeholder="比如：去海边看日出、一起做饭..." maxlength="100">
    <button onclick="addCard()">＋ 添加</button>
  </div>

  <div id="cardsContainer"></div>
</div>

<script>
const MOODS = ['😍','😆','🥰','😋','🥳','🤩','😌','😅','😢','😤','🤯','😴'];

let list = JSON.parse(localStorage.getItem('couple_plans') || '[]');

function save() {
  localStorage.setItem('couple_plans', JSON.stringify(list));
  render();
}

function addCard() {
  const t = document.getElementById('titleInput').value.trim();
  const d = document.getElementById('descInput').value.trim();
  if (!t) return;
  list.unshift({ id: Date.now(), title: t, desc: d, done: false, time: '', mood: '' });
  document.getElementById('titleInput').value = '';
  document.getElementById('descInput').value = '';
  save();
}

function del(id) {
  list = list.filter(x => x.id !== id);
  save();
}

function toggleDone(id) {
  const item = list.find(x => x.id === id);
  if (!item) return;
  if (item.done) {
    item.done = false;
    item.time = '';
    item.mood = '';
  } else {
    const timeStr = document.getElementById('timeInput_' + id);
    const moodStr = document.getElementById('moodHidden_' + id);
    if (timeStr) item.time = timeStr.value;
    if (moodStr) item.mood = moodStr.value;
    item.done = true;
  }
  save();
}

function setMood(id, mood) {
  const item = list.find(x => x.id === id);
  if (!item) return;
  item.mood = mood;
  document.getElementById('moodHidden_' + id).value = mood;
  document.querySelectorAll('#moodPicker_' + id + ' span').forEach(s => {
    s.style.background = s.textContent === mood ? '#ffe0b2' : '';
  });
}

function saveTime(id) {
  const timeInput = document.getElementById('timeInput_' + id);
  if (!timeInput) return;
  const item = list.find(x => x.id === id);
  if (item) item.time = timeInput.value;
  save();
}

function updateStats() {
  let done = 0, todo = 0;
  list.forEach(x => x.done ? done++ : todo++);
  document.getElementById('doneCount').textContent = done;
  document.getElementById('todoCount').textContent = todo;
}

function render() {
  const container = document.getElementById('cardsContainer');
  if (list.length === 0) {
    container.innerHTML = '<div class="empty"><span class="big">📝</span>还没有约定，快添加第一个吧</div>';
  } else {
    container.innerHTML = list.map(item => {
      const moodPickerHtml = !item.done ? `
        <div class="mood-picker" id="moodPicker_${item.id}">
          ${MOODS.map(m => `<span onclick="setMood(${item.id},'${m}')" style="${item.mood===m?'background:#ffe0b2':''}">${m}</span>`).join('')}
        </div>
        <input type="hidden" id="moodHidden_${item.id}" value="${item.mood}">
      ` : '';

      const timeInputHtml = !item.done ? `
        <div class="time-input-row">
          <span>完成时间：</span>
          <input type="date" id="timeInput_${item.id}" value="${item.time}" onchange="saveTime(${item.id})">
        </div>
      ` : '';

      const moodDisplay = item.mood ? `<div class="card-mood">${item.mood}</div>` : '';
      const timeDisplay = item.time ? `<div class="card-time">🕐 ${item.time}</div>` : '';

      return `
        <div class="card ${item.done ? 'done' : ''}">
          <span class="del" onclick="del(${item.id})">✕</span>
          <div class="card-title">
            ${item.title}
            ${item.done ? '<span class="badge done-badge">已完成</span>' : '<span class="badge">待完成</span>'}
          </div>
          ${item.desc ? `<div style="font-size:0.82rem;color:#666;margin-bottom:4px">${item.desc}</div>` : ''}
          ${item.done ? timeDisplay : timeInputHtml}
          ${item.done ? moodDisplay : moodPickerHtml}
          <div class="card-actions">
            <button onclick="toggleDone(${item.id})">${item.done ? '↩ 取消完成' : '✅ 标记完成'}</button>
            <button class="del-btn" onclick="del(${item.id})">删除</button>
          </div>
        </div>
      `;
    }).join('');
  }
  updateStats();
}

render();
</script>
</body>
</html>
